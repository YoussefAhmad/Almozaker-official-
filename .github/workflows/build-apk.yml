name: Build Almozaker Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'www/**'
      - 'resources/**'
      - 'config.xml'
      - 'package.json'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Cordova CLI
        run: npm install -g cordova@12

      - name: Install project dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          elif [ -f package.json ]; then
            npm install
          fi

      - name: Check resources
        run: |
          test -f resources/icon.png
          test -f resources/splash.png
          test -f resources/notification.png

      - name: Add Android platform
        run: |
          if [ ! -d platforms/android ]; then
            cordova platform add android@13
          fi

      - name: Prepare Android resources
        run: |
          npm install --no-save cordova-res
          npx cordova-res android --skip-config --copy

      - name: Prepare Android platform resources
        run: cordova prepare android

      - name: Build signed Debug APK
        run: cordova build android

      - name: Find Debug APK
        run: |
          APK="platforms/android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK" || {
            echo "ERROR: Debug APK was not generated at $APK"
            find platforms/android -type f -name "*.apk" -print
            exit 1
          }
          mkdir -p release
          cp "$APK" release/Almozaker-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Almozaker-debug-apk
          path: release/Almozaker-debug.apk
          if-no-files-found: error
