name: Build Almozaker Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'www/**'
      - 'resources/**'
      - 'config.xml'
      - 'package.json'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Cordova CLI
        run: npm install -g cordova@12

      - name: Install project dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          elif [ -f package.json ]; then
            npm install
          fi

      - name: Verify resources
        run: |
          test -f resources/icon.png || (echo "Missing resources/icon.png" && exit 1)
          test -f resources/splash.png || (echo "Missing resources/splash.png" && exit 1)
          test -f resources/notification.png || (echo "Missing resources/notification.png" && exit 1)
          ls -lh resources/icon.png resources/splash.png resources/notification.png

      - name: Add Android platform
        run: |
          if [ ! -d platforms/android ]; then
            cordova platform add android@13
          fi

      - name: Prepare Android resources
        run: |
          npm install --no-save cordova-res
          npx cordova-res android --skip-config --copy

      - name: Build APK
        run: |
          cordova build android --release
          echo "APK files produced:"
          find platforms -type f -name "*.apk" -print
          find platforms -type f -name "*.apk" | grep -q . || {
            echo "ERROR: Cordova build completed but no APK was found under platforms/"
            exit 1
          }

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: almozaker-release-apk
          path: platforms/**/*.apk
          if-no-files-found: error
