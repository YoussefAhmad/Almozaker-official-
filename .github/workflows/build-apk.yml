name: Build Almozaker APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Cordova
        run: npm install -g cordova
      - name: Install project dependencies
        run: npm install
      - name: Generate icon and splash resources
        run: |
          npm install -g cordova-res
          cordova-res android --icon resources/icon.png --splash resources/icon.png
      - name: Add Android platform
        run: npx cordova platform add android@13
      - name: Copy notification icon into Android resources
        run: |
          mkdir -p platforms/android/app/src/main/res/drawable
          cp resources/icon.png platforms/android/app/src/main/res/drawable/notification_icon.png
      - name: Build APK
        run: npx cordova build android
      - uses: actions/upload-artifact@v4
        with:
          name: Almozaker-debug-apk
          path: platforms/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
