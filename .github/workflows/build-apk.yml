name: Build Almozaker APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Cordova and resource generator
        run: npm install -g cordova cordova-res

      - name: Install project dependencies
        run: npm install

      - name: Add Android platform
        run: npx cordova platform add android@13

      - name: Use resources/icon.png for icon, splash, and notification source
        run: |
          test -s resources/icon.png || (echo 'Missing resources/icon.png'; exit 1)
          mkdir -p resources/android
          cp resources/icon.png resources/splash.png
          cp resources/icon.png resources/android/splash.png
          cp resources/icon.png resources/notification.png

      - name: Generate Android icon and splash resources
        run: cordova-res android --skip-config --copy

      - name: Copy notification image into Android resources
        run: |
          mkdir -p platforms/android/app/src/main/res/drawable
          cp resources/icon.png platforms/android/app/src/main/res/drawable/notification_icon.png

      - name: Build APK
        run: npx cordova build android

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Almozaker-debug-apk
          path: platforms/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
