name: Build Almozaker Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'www/**'
      - 'resources/**'
      - 'config.xml'
      - 'package.json'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform tools and SDK
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Cordova CLI
        run: npm install -g cordova@12

      - name: Install project dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          elif [ -f package.json ]; then
            npm install
          fi

      - name: Verify resource files
        run: |
          test -f resources/icon.png || (echo "Missing resources/icon.png" && exit 1)
          test -f resources/splash.png || (echo "Missing resources/splash.png" && exit 1)
          test -f resources/notification.png || (echo "Missing resources/notification.png" && exit 1)
          python3 - <<'PY'
          from PIL import Image
          for p in ['resources/icon.png','resources/splash.png','resources/notification.png']:
              im=Image.open(p)
              print(p, im.size, im.mode)
          s=Image.open('resources/splash.png')
          if s.width < 1920 or s.height < 1920:
              raise SystemExit('resources/splash.png must be at least 1920x1920')
          PY

      - name: Add Android platform
        run: |
          if [ ! -d platforms/android ]; then
            cordova platform add android@13
          fi

      - name: Prepare Android resources
        run: |
          npm install --no-save cordova-res
          npx cordova-res android --skip-config --copy

      - name: Build release APK
        run: cordova build android --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: almozaker-release-apk
          path: platforms/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
